<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pantry</title>
    <!-- Load Tailwind CSS via CDN (no build required for local use) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for a cleaner look */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #d1d5db; /* gray-300 */
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f3f4f6; /* gray-100 */
        }
        /* Custom font */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-blue': '#1e40af',
                        'primary-light': '#eff6ff',
                        'danger-red': '#ef4444',
                        'warning-yellow': '#facc15',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen antialiased">

    <!-- Main Application Container -->
    <div id="app" class="p-4 md:p-8 max-w-7xl mx-auto">

        <!-- Header -->
        <header class="mb-8 border-b pb-4">
            <h1 class="text-3xl font-extrabold text-primary-blue md:text-4xl">Smart Pantry</h1>
            <p class="text-gray-600 mt-1">Inventory & Expiration Management for Team 10</p>
        </header>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- 1. Add Item Form (Left Column on Desktop) -->
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-200">
                    <h2 class="text-2xl font-semibold mb-6 text-gray-800">Add New Item</h2>
                    <form id="addItemForm" class="space-y-4">
                        <!-- Item Name -->
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Item Name</label>
                            <input type="text" id="name" name="name" required class="w-full p-2 border border-gray-300 rounded-lg focus:ring-primary-blue focus:border-primary-blue transition duration-150">
                        </div>

                        <!-- Quantity and Unit (In one row for responsiveness) -->
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label for="quantity" class="block text-sm font-medium text-gray-700 mb-1">Quantity</label>
                                <input type="number" id="quantity" name="quantity" required min="1" value="1" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-primary-blue focus:border-primary-blue transition duration-150">
                            </div>
                            <div>
                                <label for="unit" class="block text-sm font-medium text-gray-700 mb-1">Unit (e.g., count, oz, lb)</label>
                                <input type="text" id="unit" name="unit" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-primary-blue focus:border-primary-blue transition duration-150" value="Count">
                            </div>
                        </div>

                        <!-- Expiration Date -->
                        <div>
                            <label for="expiration" class="block text-sm font-medium text-gray-700 mb-1">Expiration Date</label>
                            <input type="date" id="expiration" name="expiration" required class="w-full p-2 border border-gray-300 rounded-lg focus:ring-primary-blue focus:border-primary-blue transition duration-150">
                        </div>

                        <!-- Add Button -->
                        <button type="submit" class="w-full bg-primary-blue text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition duration-300 shadow-md">
                            Add to Pantry
                        </button>
                    </form>
                    <!-- Message Box for Alerts (replacing alert()) -->
                    <div id="messageBox" class="mt-4 p-3 hidden rounded-lg text-sm font-medium"></div>
                </div>
            </div>

            <!-- 2. Inventory Tracking (Right Column on Desktop) -->
            <div class="lg:col-span-2">
                <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-200 h-full flex flex-col">
                    <h2 class="text-2xl font-semibold mb-4 text-gray-800">Current Inventory</h2>

                    <!-- Filter/Sort Controls -->
                    <div class="flex flex-col sm:flex-row justify-between items-center mb-4 space-y-2 sm:space-y-0">
                        <span class="text-md font-medium text-gray-600">Total Items: <span id="totalItemsCount" class="font-bold">0</span></span>
                        <select id="sortSelect" class="p-2 border border-gray-300 rounded-lg text-sm transition duration-150">
                            <option value="name">Sort by Name</option>
                            <option value="expiration_asc">Expiration Date (Soonest)</option>
                            <option value="expiration_desc">Expiration Date (Latest)</option>
                        </select>
                    </div>

                    <!-- Inventory List Container -->
                    <div id="inventoryList" class="space-y-3 overflow-y-auto custom-scrollbar flex-grow">
                        <!-- Inventory items will be injected here -->
                    </div>

                    <div id="emptyState" class="text-center py-10 text-gray-500 hidden">
                        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
                        </svg>
                        <h3 class="mt-2 text-sm font-medium text-gray-900">Pantry is Empty!</h3>
                        <p class="mt-1 text-sm text-gray-500">
                            Get started by adding an item using the form on the left.
                        </p>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- Mock Data and Initialization ---
        // Data is simulated and stored locally in this array. It will reset on page refresh.
        let pantryItems = [
            { id: 1, name: "Milk", quantity: 1, unit: "Gallon", expiration: "2025-10-30" },
            { id: 2, name: "Eggs", quantity: 12, unit: "Count", expiration: "2025-11-25" },
            { id: 3, name: "Bread (Sourdough)", quantity: 1, unit: "Loaf", expiration: "2025-10-26" },
            { id: 4, name: "Canned Beans", quantity: 4, unit: "Can", expiration: "2026-06-01" },
            { id: 5, name: "Yogurt (Strawberry)", quantity: 6, unit: "Count", expiration: "2025-10-23" }, // Imminent expiration
        ];
        let nextItemId = 6; // Start ID counter after initial items

        const inventoryList = document.getElementById('inventoryList');
        const form = document.getElementById('addItemForm');
        const sortSelect = document.getElementById('sortSelect');
        const messageBox = document.getElementById('messageBox');
        const emptyState = document.getElementById('emptyState');
        const totalItemsCount = document.getElementById('totalItemsCount');

        // Helper function to display messages
        function showMessage(text, type = 'success') {
            messageBox.textContent = text;
            messageBox.classList.remove('hidden', 'bg-red-100', 'text-danger-red', 'bg-green-100', 'text-green-700');
            if (type === 'error') {
                messageBox.classList.add('bg-red-100', 'text-danger-red');
            } else {
                messageBox.classList.add('bg-green-100', 'text-green-700');
            }
            setTimeout(() => {
                messageBox.classList.add('hidden');
            }, 4000);
        }

        // Helper function to check days left
        function getDaysUntilExpiration(dateString) {
            const today = new Date();
            today.setHours(0, 0, 0, 0); // Normalize today
            const expirationDate = new Date(dateString);
            expirationDate.setHours(0, 0, 0, 0); // Normalize expiration
            const diffTime = expirationDate - today;
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        // --- Rendering Logic ---

        function renderInventory() {
            // 1. Sort the items
            const sortBy = sortSelect.value;
            let sortedItems = [...pantryItems];

            if (sortBy === 'name') {
                sortedItems.sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortBy === 'expiration_asc') {
                sortedItems.sort((a, b) => new Date(a.expiration) - new Date(b.expiration));
            } else if (sortBy === 'expiration_desc') {
                sortedItems.sort((a, b) => new Date(b.expiration) - new Date(a.expiration));
            }

            // 2. Clear and update list
            inventoryList.innerHTML = '';
            totalItemsCount.textContent = sortedItems.length;

            if (sortedItems.length === 0) {
                emptyState.classList.remove('hidden');
                inventoryList.classList.add('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
                inventoryList.classList.remove('hidden');
            }

            // 3. Render each item card
            sortedItems.forEach(item => {
                const daysLeft = getDaysUntilExpiration(item.expiration);
                let warningClass = '';
                let warningText = '';

                if (daysLeft < 0) {
                    warningClass = 'bg-danger-red/10 border-danger-red text-danger-red';
                    warningText = 'EXPIRED!';
                } else if (daysLeft <= 3) {
                    warningClass = 'bg-danger-red/10 border-danger-red text-danger-red';
                    warningText = `Expires in ${daysLeft} day${daysLeft !== 1 ? 's' : ''}`;
                } else if (daysLeft <= 7) {
                    warningClass = 'bg-warning-yellow/10 border-warning-yellow text-warning-yellow';
                    warningText = `Expires in ${daysLeft} days`;
                } else {
                    warningClass = 'bg-primary-light border-primary-blue text-primary-blue';
                    warningText = 'Fresh';
                }

                const itemHtml = `
                    <div id="item-${item.id}" class="flex justify-between items-center p-4 bg-white rounded-lg shadow-sm border-l-4 ${warningClass.includes('danger-red') ? 'border-danger-red' : (warningClass.includes('warning-yellow') ? 'border-warning-yellow' : 'border-primary-blue')} transition duration-200 hover:shadow-md">
                        <div class="flex-1 min-w-0 pr-4">
                            <h3 class="text-lg font-bold text-gray-800 truncate">${item.name}</h3>
                            <p class="text-sm text-gray-600">${item.quantity} ${item.unit}</p>
                        </div>
                        <div class="text-right flex-shrink-0">
                            <p class="text-xs font-semibold ${warningClass.includes('danger-red') ? 'text-danger-red' : (warningClass.includes('warning-yellow') ? 'text-warning-yellow' : 'text-gray-600')}">
                                ${warningText}
                            </p>
                            <p class="text-xs text-gray-500">
                                Exp: ${new Date(item.expiration).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}
                            </p>
                        </div>
                        <button onclick="removeItem(${item.id})" class="ml-4 p-2 text-gray-400 hover:text-danger-red transition duration-150 rounded-full hover:bg-red-50" aria-label="Remove item">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                `;
                inventoryList.insertAdjacentHTML('beforeend', itemHtml);
            });
        }

        // --- Event Handlers ---

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(form);
            const name = formData.get('name').trim();
            const quantity = parseInt(formData.get('quantity'));
            const unit = formData.get('unit').trim();
            const expiration = formData.get('expiration');

            if (!name || isNaN(quantity) || quantity <= 0 || !expiration) {
                showMessage("Please fill out all fields correctly.", 'error');
                return;
            }

            const newItem = {
                id: nextItemId++,
                name,
                quantity,
                unit,
                expiration,
            };

            pantryItems.push(newItem);
            renderInventory(); // Re-render the list
            form.reset(); // Clear the form
            document.getElementById('quantity').value = 1; // Reset quantity default
            showMessage(`Added ${name} (${quantity} ${unit}) to the pantry!`);
        });

        // Global function for removal (called by the button)
        window.removeItem = function(id) {
            const itemIndex = pantryItems.findIndex(item => item.id === id);
            if (itemIndex !== -1) {
                const removedItem = pantryItems.splice(itemIndex, 1)[0];
                renderInventory();
                showMessage(`Removed ${removedItem.name} from inventory.`, 'error');
            }
        }

        // Handle sort change
        sortSelect.addEventListener('change', renderInventory);

        // --- Initialization on Load ---
        document.addEventListener('DOMContentLoaded', () => {
            // Set the minimum date for the date picker to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('expiration').setAttribute('min', today);

            // Initial render
            renderInventory();
        });

    </script>
</body>
</html>
